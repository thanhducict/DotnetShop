services:
  catalogdb:
    container_name: catalogdb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Secret12
    restart: always
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S catalogdb -U sa -P Secret12 -C -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  catalog.migration:
    container_name: catalog.migration
    command: /opt/mssql-tools18/bin/sqlcmd -S catalogdb -U sa -P Secret12 -C -i /migration/setupdatabase.sql
    depends_on:
      catalogdb:
        condition: service_healthy
    volumes:
      - type: bind
        source: src/DotnetShop.Catalog.API/setupdatabase.sql
        target: /migration/setupdatabase.sql

  cartdb:
    container_name: cartdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=CartDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - "postgres_cart:/var/lib/postgresql/data/"

  distributedcache:
    container_name: distributedcache
    restart: always
    ports:
      - '6379:6379'

  orderingdb:
    container_name: orderingdb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Secret12
    restart: always
    ports:
      - "1434:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S orderingdb -U sa -P Secret12 -C -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  messagebroker:
    container_name: messagebroker
    hostname: dotnetshopmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  catalog.api:
    container_name: catalog.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ConnectionStrings__CatalogDB=Server=catalogdb;Database=CatalogDb;User Id=sa;Password=Secret12;TrustServerCertificate=True
      - ASPNETCORE_Kestrel__Certificates__Default__Password=mycertificate
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    depends_on:
        - catalog.migration
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ~/.aspnet/https:/https:ro

  shoppingcart.api:
    container_name: shoppingcart.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ConnectionStrings__CartDB=Server=cartdb;Port=5432;Database=CartDb;User Id=admin;Password=secret;Include Error Detail=true
      - ConnectionStrings__Redis=distributedcache:6379
      - GrpcSettings__DiscountUrl=https://discount.grpc:8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=mycertificate
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - MessageBroker__Uri=amqp://dotnetshopmq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
    depends_on:
        - cartdb
        - distributedcache
        - discount.grpc
        - messagebroker
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ~/.aspnet/https:/https:ro

  discount.grpc:
    container_name: discount.grpc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ConnectionStrings__DiscountDb=Data Source=App_Data\\discount.db
      - ASPNETCORE_Kestrel__Certificates__Default__Password=mycertificate
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    ports:
      - "6002:8080"
      - "6062:8081"
    volumes:
      - ~/.aspnet/https:/https:ro

  ordering.migrations:
    container_name: ordering.migrations
    build:
      context: .
      target: final
      dockerfile: src\DotnetShop.Ordering.API\Dockerfile
    depends_on:
      orderingdb:
        condition: service_healthy

  ordering.api:
    container_name: ordering.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ConnectionStrings__OrderingDB=Server=orderingdb;Database=OrderingDb;User Id=sa;Password=Secret12;TrustServerCertificate=True
      - ASPNETCORE_Kestrel__Certificates__Default__Password=mycertificate
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - MessageBroker__Uri=amqp://dotnetshopmq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
    depends_on:
      orderingdb:
        condition: service_healthy
      messagebroker:
        condition: service_started
    ports:
      - "6003:8080"
      - "6063:8081"
    volumes:
      - ~/.aspnet/https:/https:ro

  yarpapigateway:
    container_name: yarpapigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=mycertificate
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    depends_on:
      - catalog.api
      - shoppingcart.api
      - ordering.api
    ports:
      - "6004:8080"
      - "6064:8081"
    volumes:
      - ~/.aspnet/https:/https:ro
