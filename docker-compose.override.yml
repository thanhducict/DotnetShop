services:
  catalogdb:
    image: mcr.microsoft.com/mssql/server
    container_name: catalogdb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Secret12
    restart: always
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S catalogdb -U sa -P Secret12 -C -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    
  catalog.migration:
    image: mcr.microsoft.com/mssql/server
    container_name: catalog.migration
    command: /opt/mssql-tools18/bin/sqlcmd -S catalogdb -U sa -P Secret12 -C -i /migration/setupdatabase.sql
    depends_on:
      catalogdb:
        condition: service_healthy
    volumes:
      - type: bind
        source: src/DotnetShop.Catalog.API/setupdatabase.sql
        target: /migration/setupdatabase.sql

  cartdb:
    image: postgres
    container_name: cartdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=CartDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - "postgres_cart:/var/lib/postgresql/data/"

  distributedcache:
    image: redis
    container_name: distributedcache
    restart: always
    ports:
      - '6379:6379'

  orderingdb:
    image: mcr.microsoft.com/mssql/server
    container_name: orderingdb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Secret12
    restart: always
    ports:
      - "1434:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S orderingdb -U sa -P Secret12 -C -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
  
  ordering.migrations:
    image: ${DOCKER_REGISTRY-}ordering.migration
    container_name: ordering.migrations
    build:
      context: .
      target: migrations
      dockerfile: src\DotnetShop.Ordering.API\Dockerfile
    environment:
      - ConnectionStrings__OrderingDB=Server=orderingdb;Database=OrderingDb;User Id=sa;Password=Secret12;TrustServerCertificate=True
    depends_on:
      orderingdb:
        condition: service_healthy

  identitydb:
    image: mcr.microsoft.com/mssql/server
    container_name: identitydb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Secret12
    restart: always
    ports:
      - "1435:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S catalogdb -U sa -P Secret12 -C -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  messagebroker:
    image: rabbitmq:management
    container_name: messagebroker
    hostname: dotnetshopmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  yarpapigateway:
    image: ${DOCKER_REGISTRY-}yarpapigateway
    container_name: yarpapigateway
    build:
      context: .
      dockerfile: src\DotnetShop.YarpApiGateway\Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=mycertificate
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    depends_on:
      - catalog.api
      - shoppingcart.api
      - ordering.api
    ports:
      - "6004:8080"
      - "6064:8081"
    volumes:
      - ~/.aspnet/https:/https:ro
