version: '3.4'

services:
  catalogdb:
    image: mcr.microsoft.com/mssql/server

  catalog.migration:
    image: mcr.microsoft.com/mssql/server

  cartdb:
    image: postgres

  distributedcache:
    image: redis

  orderingdb:
    image: mcr.microsoft.com/mssql/server

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: src\DotnetShop.Catalog.API\Dockerfile
    depends_on:
      - catalog.migration

  messagebroker:
    image: rabbitmq:management

  shoppingcart.api:
    image: ${DOCKER_REGISTRY-}shoppingcart
    build:
      context: .
      dockerfile: src\DotnetShop.ShoppingCart.API\Dockerfile

  discount.grpc:
    image: ${DOCKER_REGISTRY-}discount
    build:
      context: .
      dockerfile: src\DotnetShop.Discount.Grpc\Dockerfile

  ordering.migrations:
    image: mcr.microsoft.com/dotnet/sdk:9.0

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      target: final
      dockerfile: src\DotnetShop.Ordering.API\Dockerfile
    depends_on:
      - ordering.migrations

  yarpapigateway:
    image: ${DOCKER_REGISTRY-}yarpapigateway
    build:
      context: .
      dockerfile: src\DotnetShop.YarpApiGateway\Dockerfile

volumes:
  postgres_catalog:
  postgres_cart:
