version: '3.4'

services:
  catalogdb:
    image: mcr.microsoft.com/mssql/server

  cartdb:
    image: postgres

  distributedcache:
    image: redis

  orderingdb:
    image: mcr.microsoft.com/mssql/server

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: src\DotnetShop.Catalog.API\Dockerfile
    depends_on:
      - catalog.migration

  messagebroker:
    image: rabbitmq:management

  shoppingcart.api:
    image: ${DOCKER_REGISTRY-}shoppingcart
    build:
      context: .
      dockerfile: src\DotnetShop.ShoppingCart.API\Dockerfile

  discount.grpc:
    image: ${DOCKER_REGISTRY-}discount
    build:
      context: .
      dockerfile: src\DotnetShop.Discount.Grpc\Dockerfile

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      dockerfile: src\DotnetShop.Ordering.API\Dockerfile

  catalog.migration:
    image: mcr.microsoft.com/mssql-tools
    command: /opt/mssql-tools/bin/sqlcmd -S catalogdb -U sa -P Secret12 -i /migration/setupdatabase.sql
    depends_on:
      - catalogdb
    volumes:
      - type: bind
        source: src/DotnetShop.Catalog.API/setupdatabase.sql
        target: /migration/setupdatabase.sql
  

volumes:
  postgres_catalog:
  postgres_cart:
