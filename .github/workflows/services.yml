name: CICD for Services

on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: dotnetshop-api
  AZURE_WEBAPP_PACKAGE_PATH: "/backend"
  DOTNET_VERSION: 9

jobs:
  build_and_deploy_catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses:	actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DotnetShop.sln
      - name: Build
        run: dotnet build DotnetShop.sln --no-restore --configuration release 
      - name: Publish site
        run: dotnet publish /DotnetShop.Api/DotnetShop.Api.csproj -c release -o "artifacts" 
      - name: Deploy
        uses: azure/webapps-deploy@v2
        with: 
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE  }}
          package: "artifacts"
